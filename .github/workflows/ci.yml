name: CI

# Each action is pinned to a commit SHA, so a moved tag can't change the code that runs.
# Dependabot updates the SHA and the version comment together.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          version=$(sed -n 's/^rust = "\(.*\)"/\1/p' mise.toml)
          rustup toolchain install "$version" --profile minimal --component clippy
          rustup default "$version"

      - name: Cache Cargo and fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
            native/target
            engine/tests/fixtures/.cache
          key: cargo-${{ runner.os }}-${{ hashFiles('engine/Cargo.lock', 'native/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check
        run: scripts/check.sh
