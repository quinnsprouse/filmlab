[package]
name = "filmlab"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
axum = "0.8"
base64 = "0.23"
rmcp = { version = "3.5", default-features = false, features = [
  "server",
  "transport-streamable-http-server",
] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
tokio-util = "0.7"
filmlab-engine = { path = "../engine" }
gpui-kit = "=0.7.3"
block2 = "0.6"
bytemuck = "1"
futures = "0.3"
image = { version = "0.25.1", default-features = false, features = ["jpeg"] }
libc = "0.2"
mimalloc = "0.1"
libmimalloc-sys = { version = "0.1", features = ["extended"] }
objc2 = "0.6"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
pollster = "0.4"
rayon = "1"
raw-window-handle = "0.6"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30.0.1"

[profile.release]
debug = "line-tables-only"
codegen-units = 16

# why: what ships: whole-program optimisation (fat LTO, one codegen unit) for speed, and no symbols for size
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"

# why: the shipped build with its symbols, for measuring what takes space (cargo bloat --profile bloat)
[profile.bloat]
inherits = "dist"
strip = false

[profile.dev.package."*"]
opt-level = 3

[patch."https://github.com/storytold/lightcraft"]
lightcraft-pipeline = { path = "../engine/vendor/lightcraft-pipeline" }
# why: raw, raster and codecs carry Filmlab's faster decode (parallel lossless JPEG, banded preview JPEG, parallel orientation), bit-identical to f34c7a8
lightcraft-raw = { path = "../engine/vendor/lightcraft-raw" }
lightcraft-raster = { path = "../engine/vendor/lightcraft-raster" }
lightcraft-codecs = { path = "../engine/vendor/lightcraft-codecs" }
