[package]
name = "lightcraft-raw"
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "LightCraft RAW decoding, demosaicing and DNG colour model (vendored at f34c7a8) with Filmlab's faster lossless-JPEG decode"

[dependencies]
lightcraft-tiff = { git = "https://github.com/storytold/lightcraft", rev = "f34c7a8a89e0d1bade0a6889185f40acecc84a9f" }
lightcraft-meta = { git = "https://github.com/storytold/lightcraft", rev = "f34c7a8a89e0d1bade0a6889185f40acecc84a9f" }
lightcraft-raster = { git = "https://github.com/storytold/lightcraft", rev = "f34c7a8a89e0d1bade0a6889185f40acecc84a9f" }
lightcraft-color = { git = "https://github.com/storytold/lightcraft", rev = "f34c7a8a89e0d1bade0a6889185f40acecc84a9f" }
lightcraft-geom = { git = "https://github.com/storytold/lightcraft", rev = "f34c7a8a89e0d1bade0a6889185f40acecc84a9f" }
serde = { version = "1", features = ["derive", "rc"] }
thiserror = { version = "2" }
rayon = { version = "1" }
miniz_oxide = { version = "0.8" }
zune-jpeg = { version = "0.5", default-features = false, features = ["std", "x86", "neon"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
jxl-oxide = { version = "0.12", default-features = false, optional = true }

[features]
default = ["jxl"]
## JPEG XL compressed DNGs (DNG 1.7, compression 52546) via jxl-oxide (pure Rust, MIT OR Apache-2.0).
jxl = ["dep:jxl-oxide"]
