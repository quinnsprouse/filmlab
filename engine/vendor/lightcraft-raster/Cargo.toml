[package]
name = "lightcraft-raster"
version = "0.8.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "LightCraft raster (vendored at f34c7a8) with Filmlab's parallel orientation and faster Gaussian blur (bit-identical)"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
lightcraft-geom = { git = "https://github.com/storytold/lightcraft", rev = "f34c7a8a89e0d1bade0a6889185f40acecc84a9f" }
lightcraft-color = { git = "https://github.com/storytold/lightcraft", rev = "f34c7a8a89e0d1bade0a6889185f40acecc84a9f" }
rayon = { version = "1", optional = true }

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
