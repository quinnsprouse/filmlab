[package]
name = "filmlab-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
lightcraft-engine = { git = "https://github.com/storytold/lightcraft", rev = "f34c7a8a89e0d1bade0a6889185f40acecc84a9f" }
lightcraft-geom = { git = "https://github.com/storytold/lightcraft", rev = "f34c7a8a89e0d1bade0a6889185f40acecc84a9f" }
lightcraft-meta = { git = "https://github.com/storytold/lightcraft", rev = "f34c7a8a89e0d1bade0a6889185f40acecc84a9f" }
lightcraft-raster = { git = "https://github.com/storytold/lightcraft", rev = "f34c7a8a89e0d1bade0a6889185f40acecc84a9f" }
rayon = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-rayon = { version = "1.3", optional = true }

[features]
threads = ["dep:wasm-bindgen-rayon"]

[profile.release]
debug = false
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"

[profile.release.package]
lightcraft-pipeline = { opt-level = 3 }
lightcraft-raster = { opt-level = 3 }
lightcraft-color = { opt-level = 3 }
lightcraft-develop = { opt-level = 3 }
lightcraft-geom = { opt-level = 3 }
lightcraft-raw = { opt-level = 3 }
lightcraft-codecs = { opt-level = 3 }
lightcraft-scenes = { opt-level = 3 }
lightcraft-preview = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
zune-core = { opt-level = 3 }
jpeg-decoder = { opt-level = 3 }
jpeg-encoder = { opt-level = 3 }
png = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }

[patch."https://github.com/storytold/lightcraft"]
lightcraft-pipeline = { path = "vendor/lightcraft-pipeline" }
# why: raw, raster and codecs carry Filmlab's faster decode (parallel lossless JPEG, banded preview JPEG, parallel orientation), bit-identical to f34c7a8
lightcraft-raw = { path = "vendor/lightcraft-raw" }
lightcraft-raster = { path = "vendor/lightcraft-raster" }
lightcraft-codecs = { path = "vendor/lightcraft-codecs" }
